name: Installation compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
      - run: npm run check
      - run: node --test tests/i18n.mjs
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - run: python -B -m unittest discover -s tests -p installation_compatibility.py -v
      - run: python -B tests/runtime_merge.py
      - name: Install CPU diagnostics dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes --no-deps -r installer/locks/ci-geometry.txt
      - run: python -B tests/narrow_a_pose.py
      - run: python -B tests/animation_names.py
      - run: python -B tests/animation_diagnostics.py
      - run: python -B tests/quality_diagnostics.py
      - run: python -B tests/gpu_compatibility.py
      - run: python -B tests/kimodo_installer.py
      - run: python -B tests/game_copy_installer.py
      - if: runner.os == 'Linux'
        run: bash -n UniRig/runtime.sh UniRig/check-runtime.sh installer/install_unirig.sh
  windows-processes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
      - name: Install lightweight preview dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes --no-deps -r installer/locks/ci-pillow.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python -B tests/collection_preview_stability.py PreviewQueue WindowsPreviewJob
      - run: python -B tests/queue_recipe_browser.py
      - shell: powershell
        run: ./tests/offline_workshop.ps1
      - shell: powershell
        run: ./tests/setup_preflight_locale.ps1
      - shell: powershell
        run: ./tests/windows_setup_localization.ps1
      - shell: powershell
        run: ./tests/kimodo_probe.ps1
      - shell: powershell
        run: ./tests/kimodo_windows.ps1
