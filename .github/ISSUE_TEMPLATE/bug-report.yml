name: Bug report
description: Report an unexpected result in TRELLIS Studio.
body:
  - type: markdown
    attributes:
      value: |
        This issue will be public. Redact names, credentials, private paths and server addresses from logs and screenshots. Share only files you have permission to publish.

        For security concerns, follow the [security reporting instructions](https://github.com/yoslo59/TRELLIS-Studio/blob/main/SECURITY.md).
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the result you saw and what you expected to happen.
    validations:
      required: true
  - type: input
    id: studio-version
    attributes:
      label: Studio version or commit
      description: Use the version shown in Studio or in the Windows Setup filename.
  - type: dropdown
    id: edition
    attributes:
      label: Where did it happen?
      options:
        - Desktop
        - Server
        - Windows Setup
        - Unsure
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the actions and any settings that matter, such as the generation profile or texture method.
  - type: input
    id: windows-release
    attributes:
      label: Windows release and build
      description: Include the details shown by winver for a Setup or runtime issue if available.
  - type: input
    id: gpu
    attributes:
      label: GPU, VRAM and driver
      description: For Setup or GPU processing issues, include the GPU model, dedicated VRAM and NVIDIA driver version if known.
  - type: textarea
    id: evidence
    attributes:
      label: Error message or screenshot
      description: Paste the relevant error lines or attach a redacted screenshot.
